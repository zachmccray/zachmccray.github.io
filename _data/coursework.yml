- name: EECS 101
  title: "New Student Seminar"
  professor: Dr. David Petr
  description: >
    A seminar intended to help connect freshmen and transfer EECS students to the EECS department, their chosen profession, and each other. Topics include overviews of the various disciplines, curricula and advising, ethics and professionalism, student organizations and extracurricular activities, senior projects, and career planning.
  semester: Fall 2019
  grade: S
  category: Computer Science

- name: ECON 144
  title: "Principles of Macroeconomics"
  professor: Dr. Jo Lugovskyy
  description: >
    An analytical introduction to macroeconomics. Topics include determination of aggregate income, employment, inflation, exchange rates, and the role of fiscal and monetary policy in dealing with unemployment, inflation, and economic growth.
  semester: Fall 2019
  grade: A
  category: Economics

- name: COMS 130
  title: "Speaker-Audience Communication - Public Speaking"
  professor: Mr. Jordan Christiansen
  description: >
    This class introduces students to foundational theories in oral communication. Students will develop, research, and deliver public presentations tailored to diverse audiences while gaining confidence and reducing communication apprehension. Students will apply communication theories to evaluate speeches, explore ethical communication, and practice active listening.
  semester: Fall 2019
  grade: A
  category: Communications
  
- name: MATH 125
  title: "Calculus I"
  professor: Dr. Jeffrey Lang
  description: >
    Limits, continuity and derivatives of algebraic, trigonometric, exponential and logarithmic functions. Curve sketching, optimization and other applications of the derivative. Antiderivatives, Riemann sums, the definite integral, and the fundamental theorem of calculus.
  semester: Fall 2019
  grade: B
  category: Mathematics

- name: EECS 168
  title: "Programming I"
  professor: Dr. John Gibbons
  description: >
    Problem solving using a high level programming language and object oriented software design. Fundamental stages of software development are discussed: problem specification, program design, implementation, testing, and documentation. Introduction to programming using an object oriented language: using classes, defining classes, and extending classes. Introduction to algorithms and data structures useful for problem solving: arrays, lists, files, searching, and sorting.
  semester: Fall 2019
  grade: B
  category: Computer Science

- name: PHSX 210
  title: "General Physics I for Engineers"
  professor: Dr. Jennifer Delgado
  description: >
    Introduction to classical mechanics and thermodynamics. Designed for students in engineering and physical science majors. Students with credit for PHSX 114 may receive permission from the department to enroll in fewer than four hours. Please note that enrollment in fewer than 3 credit hours will not fulfill any general education or CLAS degree-level requirements.
  semester: Spring 2020
  grade: B
  category: Physics

- name: PHIL 148
  title: "Reason and Argument"
  professor: Dr. Eileen Nutting
  description: >
    An introduction to the theory and practice of logical analysis. Special emphasis is placed upon the logical appraisal of everyday arguments.
  semester: Spring 2020
  grade: A
  category: Philosophy

- name: MATH 146
  title: "Calculus II, Honors"
  professor: Dr. Ken Duna
  description: >
    Techniques of integration, including integration by parts. Applications of integration, including volume, arc length, work and average value. Infinite sequences and series and Taylor series. Polar coordinates, vectors and the geometry of space.
  semester: Spring 2020
  grade: A
  category: Mathematics

- name: EECS 140
  title: "Introduction to Digital Logic Design"
  professor: Dr. David Johnson
  description: >
    An introductory course in digital logic circuits covering number representation, digital codes, Boolean Algebra, combinatorial logic design, sequential logic design, and programmable logic devices.
  semester: Spring 2020
  grade: A
  category: Computer Engineering

- name: POLS 170
  title: "Introduction to International Politics"
  professor: Dr. Brian Wright
  description: >
    A study of the nation-state system including the role of nationalism, sovereignty, and power. Patterns of state action including neutralism, collective security, war, and cooperation through international organizations are stressed. Specific examples of contemporary international problems are also analyzed and discussed.
  semester: Summer 2020
  grade: A
  category: Political Science

- name: PHSX 236
  title: "General Physics II Laboratory"
  professor: Dr. Samar Ghopry
  description: >
    Experiments in electricity and magnetism, waves, and sound, with practice in data reduction and error analysis.
  semester: Summer 2020
  grade: A
  category: Physics

- name: PHSX 216
  title: "General Physics I Laboratory"
  professor: Dr. Samar Ghopry
  description: >
    Experiments in classical mechanics and thermodynamics, including practice in the ethics of recording and presenting data.
  semester: Spring 2020
  grade: A
  category: Physics

- name: PHSX 212
  title: "General Physics II"
  professor: Dr. Jennifer Delgado
  description: >
    Study of electricity, magnetism, waves, and optics.
  semester: Summer 2020
  grade: A
  category: Physics

- name: MATH 290
  title: "Elementary Linear Algebra"
  professor: Dr. Satyagopal Mandal
  description: >
    Systems of linear equations, matrices, vector spaces, linear transformations, and applications.
  semester: Fall 2020
  grade: A-
  category: Mathematics

- name: MATH 127
  title: "Calculus III"
  professor: Dr. Jeffrey Lang
  description: >
    Multivariable functions, partial derivatives and their applications, multiple integrals and their applications. Vector-valued functions, line and surface integrals, Green, Gauss and Stokes Theorems.
  semester: Fall 2020
  grade: B
  category: Mathematics

- name: EECS 268
  title: "Programming II"
  professor: Dr. John Gibbons
  description: >
    This course continues developing problem solving techniques by focusing on the imperative and object-oriented styles using Abstract Data Types. Basic data structures such as queues, stacks, trees, and graphs will be covered. Recursion. Basic notions of algorithmic efficiency and performance analysis in the context of sorting algorithms. Basic Object-Oriented techniques.
  semester: Fall 2020
  grade: B
  category: Computer Science

- name: ECON 522
  title: "Macroeconomics"
  professor: Dr. Eungsik Kim
  description: >
    The theory of national income and employment, the analysis of aggregate demand, the general degree of utilization of productive resources, the general level of prices, and related questions of policy.
  semester: Fall 2020
  grade: B+
  category: Economics

- name: ECON 142
  title: "Principles of Microeconomics"
  professor: Dr. Jo Lugovskyy
  description: >
    Introduction to microeconomic principles, including supply and demand, consumer behavior, production and cost, market structures, and the role of government.
  semester: Fall 2020
  grade: A
  category: Economics

- name: MATH 590
  title: "Linear Algebra"
  professor: Dr. Purnaprajna Bangere
  description: >
    Vector spaces, linear transformations, and matrices. Canonical forms, Determinants. Hermitian, unitary and normal transformations.
  semester: Spring 2021
  grade: A
  category: Mathematics

- name: EECS 388
  title: "Embedded Systems"
  professor: Dr. Tamzidul Hoque
  description: >
    Introduction to embedded systems design and implementation, focusing on key concepts and practical skills to develop cyber-physical systems. Includes hands-on programming with microcontrollers and a self-driving car prototype project.
  semester: Spring 2021
  grade: A
  category: Computer Science

- name: EECS 368
  title: "Programming Language Paradigms"
  professor: Dr. Andrew Gill
  description: >
    Examination of various programming paradigms, including procedural, object-oriented, functional, and logic programming. Emphasis on understanding the attributes, uses, advantages, and disadvantages of different programming languages.
  semester: Spring 2021
  grade: A
  category: Computer Science

- name: EECS 210
  title: "Discrete Structures"
  professor: Dr. Andrew Moorhead
  description: >
    Introduction to discrete mathematics with applications to computer science. Topics include logic, set theory, combinatorics, graph theory, and algorithms.
  semester: Spring 2021
  grade: B+
  category: Computer Science

- name: MATH 526
  title: "Applied Mathematical Statistics I"
  professor: Dr. Zhipeng Liu
  description: >
    Covers probability theory, random variables, expectation, variance, and distributions. Emphasis on applications of statistical methods to real-world problems. The following topics are studied with illustrations and problems drawn from various fields of applications: basic notions of probability and probability distributions; classical estimation and testing procedures for one and two sample problems; chi-square test.
  semester: Fall 2021
  grade: A
  category: Mathematics

- name: EECS 510
  title: "Introduction to the Theory of Computing"
  professor: Dr. Andrew Moorhead
  description: >
    Study of theoretical foundations of computer science, including automata theory, formal languages, computability, and complexity. Finite state automata and regular expressions. Context-free grammars and pushdown automata. Turing machines. Models of computable functions and undecidable problems. The course emphasis is on the theory of computability, especially on showing limits of computation.
  semester: Fall 2021
  grade: B
  category: Computer Science

- name: EECS 448
  title: "Software Engineering I"
  professor: Dr. David Johnson
  description: >
    This course is an introduction to software development fundamentals and software engineering. It incorporates a thorough introduction to a compiled programming language. A baseline knowledge of tools and utilities is covered including the shell, common programs, version control, IDEs, editors, and build tools. Topics include: software development principles (e.g., design patterns, modularity, loose coupling), extending larger codebases, developing larger codebases, continuous integration, continuous deployment, debugging, unit testing, test-driven development, and databases.
  semester: Fall 2021
  grade: A
  category: Computer Science

- name: ECON 520
  title: "Microeconomics"
  professor: Dr. Fangli Liao
  description: >
    Advanced analysis of microeconomic theory, focusing on consumer behavior, production, market structures, and welfare economics.
  semester: Fall 2021
  grade: A
  category: Economics

- name: ECON 426
  title: "Statistics and Data Analysis"
  professor: Dr. Saima Alam Samantha
  description: >
    An introduction to probability and statistical methods for empirical work in economics. Probability, random variables, sampling, descriptive statistics, probability distributions, estimation hypothesis testing, introduction to the regression model.
  semester: Fall 2021
  grade: A
  category: Economics

- name: MATH 558
  title: "Introductory Modern Algebra"
  professor: Dr. Jeffrey Lang
  description: >
    Development of the number systems. Polynomials. Introduction to abstract algebra, covering algebraic structures such as groups, rings, and fields, with emphasis on theoretical understanding and proofs.
  semester: Spring 2022
  grade: A
  category: Mathematics

- name: ENGL 102
  title: "Critical Reading and Writing"
  professor: Dr. Marcus Höhne
  description: >
    Builds upon instruction in writing, emphasizing critical thinking through careful reading and writing. Focus on analysis, argumentation, and research skills. Also instructs in the evaluation and use of secondary sources.
  semester: Spring 2022
  grade: A
  category: English

- name: EECS 678
  title: "Introduction to Operating Systems"
  professor: Dr. Heechul Yun
  description: >
    The objective of this course is to provide the students with the concepts necessary to enable them to: a) identify the abstract services common to all operating systems, b) define the basic system components that support the operating system's machine independent abstractions on particular target architectures, c) consider how the design and implementation of different systems components interact and constrain one another, not merely how one or two important parts work in isolation, and d) understand the means by which fundamental problems in operating systems can be analyzed and addressed. Programming assignments address topics including process creation, inter-process communication, system call implementation, process scheduling and virtual memory. Laboratory exercises primarily focus on use of tools and concepts required for the programming assignments but include a small number of independent topics.
  semester: Spring 2022
  grade: B
  category: Computer Science

- name: EECS 649
  title: "Introduction to Artificial Intelligence"
  professor: Dr. Michael Branicky
  description: >
    General concepts, search procedures, two-person games, predicate calculus and automated theorem proving, nonmonotonic logic, probabilistic reasoning, rule based systems, semantic networks, frames, dynamic memory, planning, machine learning, natural language understanding, neural networks.
  semester: Spring 2022
  grade: C
  category: Computer Science

- name: EECS 565
  title: "Introduction to Information and Computer Security"
  professor: Dr. Fengjun Li
  description: >
    An introduction to the fundamentals of cryptography and information and computer security. Introduces the basic concepts, theories, and protocols in computer security. Discusses how to apply such knowledge to analyze, design and manage secure systems in the real world. Topic covered: the basics of cryptography, software security, operating system security, database security, network security, privacy and anonymity, social engineering, digital forensics, etc.
  semester: Spring 2022
  grade: A
  category: Computer Science

- name: SOC 104
  title: "Elements of Sociology"
  professor: Professor Uros Petrovic
  description: >
    The study of social life, including how human groups are organized, how they change, and how they influence individuals. Consideration is given to a variety of human organizations and social institutions and how these groups and institutions both determine, and are determined by, human beings.
  semester: Summer 2022
  grade: A
  category: Sociology

- name: PHIL 140
  title: "Introduction to Philosophy"
  professor: Dr. Dawn Gale
  description: >
    An introductory examination, based primarily on writings of major philosophers, of such central philosophical problems as religious belief, the mind and its place in nature, freedom and determinism, morality, and the nature and kinds of human knowledge.
  semester: Summer 2022
  grade: A
  category: Philosophy

- name: ECON 526
  title: "Introduction to Econometrics"
  professor: Dr. Jinyan Li
  description: >
    An introduction to the statistical analysis of economic data and its application to economic inquiry. Includes extensive use of statistical software.
  semester: Summer 2022
  grade: A
  category: Economics

- name: EECS 581
  title: "Software Engineering II"
  professor: Dr. David Johnson
  description: >
    Continuation of software engineering principles, focusing on advanced topics such as software architecture, design patterns, and project management.
  semester: Fall 2022
  grade: A
  category: Computer Science

- name: EECS 569
  title: "Computer Forensics"
  professor: Dr. Bo Luo
  description: >
    This course covers both the theoretical and practical aspects of computer forensics. The course introduces the basic concepts, methodologies, and techniques to recover, preserve, and examine digital evidence on or transmitted by digital devices. Topics include: crime investigation and digital evidence, file system forensics, application analysis, network evidence acquisition and analysis, mobile device forensics, etc.
  semester: Fall 2022
  grade: A
  category: Computer Science

- name: EECS 563
  title: "Introduction to Communication Networks"
  professor: Dr. Morteza Hashemi
  description: >
    An introduction to the principles used in communication networks is given in this course. Topics include a discussion of the uses of communications networks, network traffic, network impairments, standards, layered reference models for organizing network functions. Local Area Network technology and protocols are discussed. Link, network, transport layer protocols, and security are introduced. TCP/IP networks are stressed. VoIP is used as an example throughout the course. Basic concepts of network performance evaluation are studied, both analytical and simulation techniques are considered.
  semester: Fall 2022
  grade: C
  category: Computer Science

- name: EECS 560
  title: "Data Structures"
  professor: Dr. Cuncong Zhong
  description: >
    A first course in abstract data structures and algorithmic design making use of these structures. Topics include asymptotic analysis, trees, dictionaries, heaps, disjoint set structures; divide and conquer, greedy, and dynamic programming algorithms.
  semester: Fall 2022
  grade: B
  category: Computer Science

- name: ECON 664
  title: "Topics in Economics: Economic Demography"
  professor: Dr. Jo Lugovskyy
  description: >
    TBD
  semester: Fall 2022
  grade: A
  category: Economics

- name: EECS 582
  title: "Computer Science & Interdisciplinary Computing Capstone"
  professor: Dr. David Johnson
  description: >
    A team-oriented lecture/laboratory course involving the specification, design, implementation, testing, and documentation of a significant software project over the full course of the semester. The course includes the consideration of project management, economics, and technical writing.
  semester: Spring 2023
  grade: A
  category: Computer Science

- name: EECS 465
  title: "Cyber Defense"
  professor: Dr. Alexandru Bardas
  description: >
    An introduction to critical knowledge and skills needed to administer and defend computer networks and systems. This course focuses on hands-on activities, learning cybersecurity defensive techniques, and understanding well know techniques used by adversaries.
  semester: Spring 2023
  grade: N/A
  category: Computer Science

- name: ECON 609
  title: "Sports Economics"
  professor: Dr. Victor Ribeiro Andrade
  description: >
    Examines the application of economic principles to the sports industry, including analysis of labor markets, team and league structures, and the economic impact of sports on society.
  semester: Spring 2023
  grade: A
  category: Economics

- name: ECON 590
  title: "Game Theory"
  professor: Dr. Minh Cao
  description: >
    Analysis of strategic choice problems. Firms, voters, bargainers, animals, sports competitors, and persons in everyday life choose alternative options with the outcomes depending on the choices of one or more other similar decision makers. Strategies of rational choices will be derived and analyzed in economic and other environments.
  semester: Spring 2023
  grade: B
  category: Economics

- name: ECON 510
  title: "Energy Economics"
  professor: Dr. Srishti Slaria
  description: >
    The application of basic economic concepts and methods to the analysis of energy markets, regulation, and policies. Topics covered include energy trends and projections, economic growth and resource exhaustion, the organization and regulation of fossil fuel industries, nuclear power and non-conventional energy technologies, the world oil market, energy conservation, environmental pollution, and national energy policies in the U.S. and other developed as well as developing countries.
  semester: Spring 2023
  grade: B
  category: Economics