title: Zachary McCray
description: Personal Website
remote_theme: just-the-docs/just-the-docs@9a7e4031a83c115bffbd6b053f319ea74c66859a
plugins:
  - jekyll-remote-theme

url: https://zachmccray.github.io

aux_links:
  GitHub: https://github.com/zachmccray

just_the_docs:
  custom_css:
    - "assets/css/custom.css"
  include_head:
    - _includes/head_custom.html

collections:
  travel:
    output: true
    permalink: /travel/:name/

# Maintainer-only files must never become Pages pages, navigation, or search.
exclude:
  - docs/
  - _firebase/
  - _tests/
  - _review/
  - .github/
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - Gemfile
  - Gemfile.lock
