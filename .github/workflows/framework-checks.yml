name: Framework accessibility and browser checks
on:
  pull_request:
    branches: [gh-pages]
  push:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      BUNDLE_GEMFILE: _tests/Gemfile.pages
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _tests/accessibility/package-lock.json
      - name: Install pinned test tools and browser
        run: |
          python -m pip install -r _tests/requirements.txt
          npm ci --prefix _tests/accessibility --no-audit --no-fund
          python -m playwright install --with-deps ${{ matrix.engine }}
          python _tests/prepare-framework-assets.py --deps _tests/accessibility/node_modules --out "$RUNNER_TEMP/browser-assets"
      - name: Build publication profile
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --disable-disk-cache --config _config.yml,_tests/pages-parity.yml --destination "$RUNNER_TEMP/site"
          python _tests/public-surface.py --site "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/framework-results/surface.json"
      - name: Check visitor journeys and accessibility
        run: |
          python _tests/framework-browser.py --site "$RUNNER_TEMP/site" --assets "$RUNNER_TEMP/browser-assets" --deps _tests/accessibility/node_modules --browser ${{ matrix.engine }} --out "$RUNNER_TEMP/framework-results/${{ matrix.engine }}"
      - name: Check native cached rebuild and BFCache history
        if: matrix.engine == 'chromium'
        run: |
          python _tests/framework-history.py --site "$RUNNER_TEMP/site" --assets "$RUNNER_TEMP/browser-assets" --out "$RUNNER_TEMP/framework-results/native-history"
      - name: Build controlled future article and optional-photo fixtures
        run: |
          python _tests/prepare-visual-fixtures.py --editorial --root "$RUNNER_TEMP/editorial-fixtures"
      - name: Check editorial navigation, disclosures and carousel viewer
        run: |
          python _tests/editorial-browser.py --site "$RUNNER_TEMP/site" --baseline "$RUNNER_TEMP/site" --assets "$RUNNER_TEMP/browser-assets" --deps _tests/accessibility/node_modules --fixtures "$RUNNER_TEMP/editorial-fixtures/site" --browser ${{ matrix.engine }} --only text --out "$RUNNER_TEMP/framework-results/editorial-text"
          python _tests/editorial-browser.py --site "$RUNNER_TEMP/site" --baseline "$RUNNER_TEMP/site" --assets "$RUNNER_TEMP/browser-assets" --deps _tests/accessibility/node_modules --fixtures "$RUNNER_TEMP/editorial-fixtures/site" --browser ${{ matrix.engine }} --only carousel --out "$RUNNER_TEMP/framework-results/editorial-carousel"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-${{ matrix.engine }}
          path: ${{ runner.temp }}/framework-results
  firebase-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run private-rules regression on demo emulators only
        run: |
          mkdir -p "$RUNNER_TEMP/firebase-tools"
          cp _tests/firebase-rules/package.json "$RUNNER_TEMP/firebase-tools/package.json"
          npm install --prefix "$RUNNER_TEMP/firebase-tools" --no-audit --no-fund
          node --test _tests/firebase.test.cjs
          export NODE_PATH="$RUNNER_TEMP/firebase-tools/node_modules"
          export FIREBASE_EMULATORS_PATH="$RUNNER_TEMP/firebase-emulators"
          "$RUNNER_TEMP/firebase-tools/node_modules/.bin/firebase" emulators:exec --only database,auth --project demo-website-reliability --config _tests/firebase-rules/firebase.json 'node --test _tests/firebase-rules/option-a.test.cjs'
